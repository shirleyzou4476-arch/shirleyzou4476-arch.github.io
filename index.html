<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c1524"><title>DockFlow · Receiving</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0c1524;--navy2:#121f32;--panel:#fff;--bg:#f3f6fa;--ink:#172235;--muted:#718096;--line:#e3e9f0;--blue:#276ef1;--green:#0aa474;--red:#e34850;--amber:#e99524;--shadow:0 8px 30px #182b4412}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:238px;background:var(--navy);color:#d6deea;padding:25px 16px;display:flex;flex-direction:column}.brand{font:700 21px 'Space Grotesk';color:#fff;margin:0 12px 34px}.brand span{color:#62a1ff}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#a9b7c9;text-align:left;padding:12px 14px;border-radius:9px}.nav button.active,.nav button:hover{background:#ffffff14;color:#fff}.nav button b{display:inline-block;width:28px;color:#8fb7ff}.user{margin-top:auto;border-top:1px solid #ffffff18;padding:16px 12px;color:#a9b7c9;font-size:12px}.user strong{display:block;color:#fff;font-size:13px;margin-bottom:3px}.main{flex:1;min-width:0}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top h1{font:600 22px 'Space Grotesk';margin:0}.date{color:var(--muted)}.content{max-width:1180px;margin:auto;padding:30px 34px 60px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:26px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card{padding:20px}.card .label{color:var(--muted);font-size:12px}.card .value{font:700 28px 'Space Grotesk';margin:7px 0}.card .hint{font-size:12px;color:var(--green)}.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:20px}.panel{padding:22px}.panel h2{font:600 17px 'Space Grotesk';margin:0 0 17px}.panel-head{display:flex;justify-content:space-between;align-items:center}.small{color:var(--muted);font-size:12px}.scanner{border:2px dashed #b9c8da;border-radius:12px;padding:25px 20px;text-align:center;background:#f8fbff}.scan-icon{font-size:39px;display:block;margin-bottom:8px}.scanner p{color:var(--muted);margin:7px 0 16px}.input-row{display:flex;gap:8px}.input-row input,.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 13px;outline:0}.input-row input:focus,.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #276ef11b}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:600}.primary{background:var(--blue);color:#fff}.subtle{background:#edf3fd;color:var(--blue)}.ghost{background:transparent;color:var(--blue);padding:5px}.result{margin-top:16px;border-radius:9px;padding:13px;text-align:left;background:#effaf7;border:1px solid #b9eadb}.result strong{display:block}.result small{color:#317d67}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line)}.table th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.pill{padding:5px 9px;border-radius:30px;font-size:11px;font-weight:600;background:#edf3fd;color:var(--blue)}.pill.green{background:#e7f8f2;color:#087b5a}.pill.red{background:#ffedef;color:#c23842}.pill.amber{background:#fff4df;color:#a76a09}.bars{display:grid;gap:14px}.barline{display:grid;grid-template-columns:92px 1fr 42px;align-items:center;gap:10px;font-size:12px}.bar{height:9px;background:#e9eff6;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.exception{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.exception:last-child{border:0}.exception strong{display:block;font-size:13px}.exception small{color:var(--muted)}.empty{text-align:center;padding:30px;color:var(--muted)}.toast{position:fixed;right:25px;bottom:25px;padding:14px 18px;background:var(--navy);color:#fff;border-radius:9px;box-shadow:var(--shadow)}.toast.red{background:var(--red)}.mobile{display:none}@media(max-width:850px){.side{width:70px;padding:20px 9px}.brand{font-size:0;text-align:center;margin:0 0 24px}.brand span{font-size:22px}.nav button{font-size:0;text-align:center}.nav button b{font-size:18px;width:auto}.user{display:none}.content{padding:22px 16px}.top{padding:0 18px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:500px){.top{height:66px}.top h1{font-size:18px}.date{font-size:11px}.cards{gap:9px}.card{padding:14px}.card .value{font-size:23px}.content{padding:17px 10px}.panel{padding:15px}.table{font-size:12px}.table th,.table td{padding:10px 4px}.hide-sm{display:none}.mobile{display:inline}}
    .success-screen{min-height:285px;border-radius:12px;background:linear-gradient(145deg,#0a9f73,#087d62);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:success-in .2s ease-out}.success-screen h2{font-size:24px;margin:8px 0}.success-screen p{color:#d9fff2;margin:5px}.success-screen small{color:#d9fff2;margin-top:10px}.success-screen .reset{opacity:.75;font-size:11px}@keyframes success-in{from{transform:scale(.97);opacity:.5}to{transform:scale(1);opacity:1}}.success-check{width:68px;height:68px;border:3px solid #fff;border-radius:50%;font-size:43px;line-height:62px;font-weight:500}
    .archive-filters{display:flex;gap:8px;align-items:end;margin:5px 0 20px;flex-wrap:wrap}.archive-filters label{display:grid;gap:5px;color:var(--muted);font-size:12px}.archive-filters input{border:1px solid var(--line);border-radius:8px;padding:10px;min-width:110px}.archive-day{border:1px solid var(--line);border-radius:9px;margin-top:10px;overflow:hidden}.archive-folder{width:100%;display:flex;gap:14px;align-items:center;border:0;background:#f8fbff;padding:15px;text-align:left;color:var(--ink)}.archive-folder span:last-child{margin-left:auto;color:var(--muted);font-size:12px}.archive-detail{padding:15px;border-top:1px solid var(--line)}.archive-cards{grid-template-columns:repeat(4,1fr);margin:0 0 15px}.archive-cards .card{box-shadow:none}.archive-exceptions{margin-top:14px;padding:12px;background:#fff4df;border-radius:8px;color:#805309}.archive-exceptions div{margin-top:6px;font-size:12px}@media(max-width:600px){.archive-filters{align-items:stretch;flex-direction:column}.archive-cards{grid-template-columns:repeat(2,1fr)}.archive-folder{flex-wrap:wrap}.archive-folder span:last-child{margin-left:0;width:100%}}
    .location-destination{font:700 34px 'Space Grotesk';letter-spacing:.04em;margin:8px 0}.move-box{font-size:24px;letter-spacing:.03em}
    .modal-backdrop{position:fixed;inset:0;background:#0c152488;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal{width:min(500px,100%);background:#fff;border-radius:12px;padding:24px;box-shadow:var(--shadow)}.modal p{color:var(--muted);line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.import-modal{width:min(760px,100%);max-height:90vh;overflow:auto}.import-actions{display:flex;gap:10px;align-items:center;margin:16px 0}.replace{display:flex;gap:8px;align-items:center;margin:16px 0}.preview{border:1px solid var(--line);border-radius:8px;padding:13px;margin:16px 0;max-height:260px;overflow:auto}.preview strong{display:block;margin-bottom:5px}.import-error{background:#ffedef;color:#a52f39;border:1px solid #f5c5ca;border-radius:8px;padding:10px 12px;line-height:1.6}.invalid{color:var(--red);font-style:italic}.btn:disabled{cursor:not-allowed;opacity:.55}
  </style>
